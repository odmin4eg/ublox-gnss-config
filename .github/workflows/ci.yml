name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: byte-compile
        run: python -m py_compile ublox_setup.py
      - name: --help
        run: python ublox_setup.py --help
      - name: --list (no receiver attached, must not crash)
        run: python ublox_setup.py --list
      - name: install as package
        run: pip install .
