<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- illustration: Start menu search with "Power" typed and PowerShell as best match -->
  <rect x="0" y="0" width="560" height="300" rx="10" fill="#1f1f28"/>
  <rect x="20" y="20" width="520" height="260" rx="10" fill="#2b2b36" stroke="#3a3a46" stroke-width="1"/>

  <!-- "Best match" label -->
  <text x="40" y="58" fill="#9aa0aa" font-size="13">Best match</text>

  <!-- best-match row (highlighted) -->
  <rect x="34" y="70" width="492" height="60" rx="8" fill="#3a3a48" stroke="#4f5160" stroke-width="1"/>
  <!-- terminal glyph -->
  <rect x="48" y="82" width="36" height="36" rx="6" fill="#0b3d66"/>
  <text x="55" y="107" fill="#e8f0ff" font-size="18" font-family="Consolas, monospace">&gt;_</text>
  <text x="98" y="98" fill="#f2f3f5" font-size="16" font-weight="600">Windows PowerShell</text>
  <text x="98" y="118" fill="#9aa0aa" font-size="12.5">App</text>

  <!-- a couple of dimmed extra results -->
  <text x="48" y="162" fill="#c7cbd2" font-size="14">Windows PowerShell ISE</text>
  <text x="48" y="190" fill="#c7cbd2" font-size="14">Windows Terminal</text>

  <!-- search box at the bottom -->
  <rect x="34" y="214" width="492" height="46" rx="23" fill="#20202a" stroke="#4f5160" stroke-width="1"/>
  <!-- magnifier -->
  <circle cx="66" cy="237" r="8" fill="none" stroke="#9aa0aa" stroke-width="2"/>
  <line x1="72" y1="243" x2="79" y2="250" stroke="#9aa0aa" stroke-width="2" stroke-linecap="round"/>
  <!-- typed text with caret -->
  <text x="92" y="242" fill="#f2f3f5" font-size="16">Power</text>
  <rect x="145" y="227" width="2" height="20" fill="#7aa2ff"/>
</svg>
